[package]
name = "synth-ui"
version = "0.1.0"
edition = "2024"
description = "Visual authoring tool for the synth modular synthesizer platform."
license = "MIT OR Apache-2.0"

[dependencies]
# Committed as a git dependency so a standalone clone of synth-ui builds with no setup.
# In the dev workspace this is redirected to the local submodule via [patch] (see dev repo Cargo.toml).
synth-core = { git = "ssh://git@github.com/hypafrag/synth-core.git", branch = "master" }

winit = "0.30"
wgpu = "22"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }

# Chrome (menu/toolbar/status bars, dockable panels) drawn with egui, composited over the
# custom wgpu canvas pass in the same frame (see docs/architecture/12-ui-rendering.md). The
# 0.29 family pairs with wgpu 22 / winit 0.30; egui_tiles 0.10 tracks egui 0.29. Panels are tiled
# with egui_tiles so the canvas can be a fixed, tab-less, non-draggable central tile.
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = "0.29"
egui_tiles = "0.10"
# Native file-open/save dialogs for the File menu.
rfd = "0.15"
