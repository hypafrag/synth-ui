[package]
name = "synth-ui"
version = "0.1.0"
edition = "2024"
description = "Visual authoring tool for the synth modular synthesizer platform."
license = "MIT OR Apache-2.0"

[dependencies]
# Committed as a git dependency so a standalone clone of synth-ui builds with no setup.
# In the dev workspace this is redirected to the local submodule via [patch] (see dev repo Cargo.toml).
synth-core = { git = "ssh://git@github.com/hypafrag/synth-core.git", branch = "master" }

winit = "0.30"
wgpu = "22"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
